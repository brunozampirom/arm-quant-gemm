name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A rebase merge rewrites the commits, so the SHA that lands on main is not
  # one any pull_request run ever saw and no push run fires for it either.
  # Without this there is no way to ask for a run on what main actually holds.
  workflow_dispatch:

jobs:
  # Correctness travels; performance does not. CI cross-compiles for aarch64
  # and checks every kernel against the scalar reference under emulation. The
  # numbers in the README come from a real phone and cannot come from here,
  # because a qemu timing is a timing of qemu.
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: Build for aarch64
        env:
          CC: aarch64-linux-gnu-gcc
        run: sh build.sh

      # The README's whole argument rests on the baseline being genuinely
      # scalar and on dot product living only in the kernel that claims it.
      # Both are properties of the emitted code, so assert them there instead
      # of trusting that the flags did what they were meant to.
      - name: Assert the baseline is scalar and sdot is contained
        run: |
          set -eu
          OD=aarch64-linux-gnu-objdump
          vec='v[0-9]+\.(16b|8h|4s|8b)'
          simd=$($OD -d build/gemm_scalar.o | grep -cE "$vec" || true)
          qsimd=$($OD -d build/gemm_quant.o | grep -cE "$vec" || true)
          leaked=$($OD -d build/gemm_neon_smull.o | grep -cw sdot || true)
          present=$($OD -d build/gemm_neon_sdot.o | grep -cw sdot || true)
          qpresent=$($OD -d build/gemm_quant_neon.o | grep -cw sdot || true)
          echo "scalar SIMD=$simd  quant reference SIMD=$qsimd"
          echo "sdot leaked into smull=$leaked  present=$present  quant=$qpresent"
          test "$simd" -eq 0
          test "$qsimd" -eq 0
          test "$leaked" -eq 0
          test "$present" -gt 0
          test "$qpresent" -gt 0

      # QEMU_CPU=max turns on the ARMv8.2 dot product extension, so the sdot
      # kernels are checked rather than skipped.
      - name: Check every kernel against the reference
        env:
          QEMU_CPU: max
        run: qemu-aarch64-static build/gemmbench --check

      - name: Check a non-multiple-of-64 K exercises the tail paths
        env:
          QEMU_CPU: max
        run: qemu-aarch64-static build/gemmbench --check -M 7 -N 5 -K 253

      # A summary that changes with the operator's locale is worse than no
      # summary, because it still looks right. awk decides whether a field is
      # numeric using the locale's decimal separator, so under a comma locale
      # the comparisons fall back to string order. Assert the property instead
      # of trusting that the LC_ALL pin stays where it is.
      - name: Assert the analysis does not depend on the locale
        run: |
          set -eu
          sudo locale-gen pt_BR.UTF-8 > /dev/null
          for f in results/sustained_*.csv; do
            LC_ALL=C           sh analyze.sh "$f" > /tmp/c.txt
            LC_ALL=pt_BR.UTF-8 sh analyze.sh "$f" > /tmp/br.txt
            diff /tmp/c.txt /tmp/br.txt || { echo "error: $f summarises differently under a comma locale"; exit 1; }
          done

      # A chart that disagrees with the table is worse than no chart. It is
      # generated from the same CSVs, so regenerate it and require the
      # committed file to match byte for byte.
      - name: Assert the chart still matches the data
        run: |
          set -eu
          sh plot.sh results/sustained_single.csv results/sustained_big.csv results/sustained_all.csv > /tmp/sustained.svg
          diff docs/sustained.svg /tmp/sustained.svg || { echo "error: docs/sustained.svg is stale; rerun plot.sh"; exit 1; }
